<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff2d9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="かわいいコマを重ねて遊ぶ三目並べ。オレンジ・青と白・黒の配色を選べます！" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>ぱくっと！ゴブとも</title>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; color: #3b3650; background: #fff6e7; --orange: #ff853d; --blue:#5aafff; --ink:#3d3650; }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 12% 2%, #fffaf2 0, transparent 40%), radial-gradient(ellipse at 90% 50%, #e8f5ff 0, transparent 40%), linear-gradient(160deg,#fff2d9,#fff8ee 60%,#ffefdb); overflow-x:hidden; }
  button, select { font: inherit; touch-action: manipulation; }
  button { cursor:pointer; }
  button:focus-visible, select:focus-visible { outline:3px solid #6267e8; outline-offset:3px; }
  .app { max-width: 525px; padding: max(12px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); margin:auto; position:relative; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin: 4px 2px 14px; }
  .brand { display:flex; align-items:center; gap:9px; min-width:0; }
  .brand-mark { background:#ffffffdd; border:2px solid #fff; box-shadow:0 4px 12px #a76e3d18; padding:5px 7px; border-radius:15px; font-size:22px; letter-spacing:-6px; padding-right:13px; flex-shrink:0; }
  .brand h1 { margin:0; font-weight: 900; letter-spacing: .01em; font-size:clamp(17px,5.35vw,29px); line-height:1.18; white-space:nowrap; }
  .brand p { margin:3px 0 0; font-size:clamp(8px,2.4vw,10px); white-space:nowrap; letter-spacing:.05em; font-weight:700; color:#88839a; }
  .round-button { flex-shrink:0; width:42px; height:42px; border:1px solid #e9e0da; color:#655d72; background:#fffdfadf; border-radius:15px; box-shadow:0 3px 9px #655d7212; font-size:22px; font-weight:800; display:grid; place-items:center; transition: transform .16s; }
  .round-button:active, .action:active { transform:scale(.94); }
  .settings { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; }
  .select-wrap { flex:1; min-width:110px; position:relative; }
  .select-wrap::after { content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:#716880; font-size:12px; }
  select { width:100%; appearance:none; padding:10px 26px 10px 12px; border:1px solid #e7ddd7; border-radius:13px; background:#fffefa; color:#584e66; font-size:12px; font-weight:800; box-shadow:0 3px 7px #836c4510; }
  .round-button.tiny { width:40px; height:40px; font-size:18px; border-radius:13px; }
  .palette-bar { display:flex; align-items:center; gap:10px; margin:-4px 2px 12px; }
  .palette-label { font-size:11px; font-weight:900; white-space:nowrap; color:#8d8193; }
  .palette-choices { display:flex; flex:1; gap:6px; min-width:0; }
  .palette-choice { display:flex; flex:1; gap:5px; align-items:center; justify-content:center; white-space:nowrap; padding:8px 4px; min-width:0; border:1.5px solid #e9ddd9; border-radius:12px; background:#fffcf8; color:#726778; font-size:clamp(9px,2.9vw,11px); font-weight:900; box-shadow:0 2px 7px #836c4510; }
  .palette-choice[aria-pressed="true"] { border-color:#b48ce4; background:#f8f0ff; color:#554468; box-shadow:0 0 0 2px #eaddff; }
  .palette-pair { display:inline-flex; align-items:center; padding-right:2px; flex-shrink:0; }
  .palette-pair i { display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid #0002; box-shadow:inset 0 -2px 0 #0002; }
  .palette-pair i+i { margin-left:-3px; }
  .palette-pair .orange { background:#ff853d; } .palette-pair .blue { background:#5aafff; }
  .palette-pair .white { background:#fff; border-color:#aab0b9; } .palette-pair .black { background:#272b35; border-color:#4f5260; }

  .message { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:19px; background:#fffdfa; box-shadow:0 8px 25px #71604d12; margin-bottom:14px; border:1px solid white; min-height:69px; }
  .turn-dot { height:43px; width:43px; flex-shrink:0; border-radius:15px; position:relative; background:linear-gradient(140deg,#ffbe69,#ff7b3c); box-shadow:inset 0 -4px 0 #db5b2690; transition:background .2s; }
  .turn-dot.blue { background:linear-gradient(140deg,#97d3ff,#448ff0); box-shadow:inset 0 -4px 0 #2d72cb80; }
  .turn-dot:before,.turn-dot:after { content:''; background:#33304d; position:absolute; top:16px; width:5px; height:7px; border-radius:10px; }
  .turn-dot:before {left:13px;} .turn-dot:after {right:13px;}
  .turn-copy { flex:1; min-width:0; }
  .turn-copy strong { font-size:15px; display:block; line-height:1.4; }
  .turn-copy small { font-size:11px; display:block; color:#898395; margin-top:3px; line-height:1.4; }
  .turn-badge { flex-shrink:0; background:#fff3de; font-size:10px; font-weight:900; border-radius:10px; padding:6px 8px; color:#9a805d; }
  .pool { position:relative; padding: 11px 13px 12px; border:2px solid #e2dfe7; border-radius:21px; background: #ffffffb8; box-shadow:0 5px 16px #6156650b; transition:opacity .2s; }
  .pool.player0 { border-color: #ffd2ac; background:linear-gradient(110deg,#fff8eb,#fff9f2); }
  .pool.player1 { border-color: #bee1ff; background:linear-gradient(110deg,#f3faff,#fcfdff); }
  .pool.active { box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #ffd293, 0 8px 20px #c78c4a20; }
  .pool.active.player1 { box-shadow:0 0 0 2px #ffffff, 0 0 0 5px #b4deff, 0 8px 20px #6596be22; }
  .pool.dim { opacity:.65; }
  .pool-head { display:flex; gap:6px; align-items:center; font-size:12px; font-weight:900; margin-bottom:6px; }
  .pool-head .name { flex:1; }
  .pool-head .count { font-size:10px; color:#938b9f; font-weight:800; }
  .swatch { width:11px; height:11px; border-radius:50%; box-shadow:inset 0 -2px 0 #0002; }
  .player0 .swatch { background:var(--orange); } .player1 .swatch { background:var(--blue); }
  .tokens { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:3px; }
  .token-slot { position:relative; display:grid; place-items:center; border-radius:12px; border:2px solid transparent; height:51px; background:transparent; padding:0; min-width:0; }
  .token-slot:disabled { cursor:default; }
  .token-slot:not(:disabled):active { background:#ffffffa0; }
  .token-slot.selected { background:#ffffffdf; border-color:#ffab65; box-shadow:0 0 0 3px #ffe3a0; }
  .player1 .token-slot.selected { border-color:#74beff; box-shadow:0 0 0 3px #d5efff; }
  .token-slot.empty::after { content:'使用中'; font-size:9px; color:#b5adba; font-weight:800; position:absolute; top:31px; }
  .token-slot.empty .gob { opacity:.12; filter:grayscale(1); transform:scale(.85); }
  .size-tag { position:absolute; right:0; top:-2px; font-size:9px; font-weight:900; color:#aba3ae; }
  .board-shell { margin:15px auto; position:relative; max-width: 446px; }
  .board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:12px; width:100%; aspect-ratio:1; border-radius:29px; border:3px solid #e9c99e; background:linear-gradient(145deg,#ffe7ba,#edce9c); box-shadow:0 6px 0 #d4ac79, 0 14px 26px #b9884c2b, inset 0 2px 2px #fff9; }
  .cell { position:relative; display:grid; place-items:center; overflow:visible; min-width:0; border-radius:20px; border:2px solid #f8e8d2; background:linear-gradient(140deg,#fffcf5,#fff3e4); box-shadow:inset 0 2px 8px #d5a8731c; padding:0; transition:background .15s, transform .15s, box-shadow .15s; }
  .cell:active { transform:scale(.975); }
  .cell::before { content:''; position:absolute; width:18%; height:18%; border:2px solid #d7bb9c80; border-radius:50%; }
  .cell.can-drop { background:linear-gradient(140deg,#fcfff4,#eeffe8); border-color:#a7dfa2; box-shadow:inset 0 0 0 2px #bcf2b2,0 0 0 2px #6bd38d35; }
  .cell.can-drop::after { content:'+'; position:absolute; top:6px; right:9px; color:#51ae74; font-weight:900; font-size:17px; }
  .cell.origin { box-shadow:inset 0 0 0 3px #ffcb66,0 0 0 3px #ffb650; }
  .cell.origin .gob { animation:selected-bob .75s ease-in-out infinite alternate; }
  .cell.last .gob { animation:pop .35s cubic-bezier(.2,1.8,.5,1); }
  .cell.win-cell { background:#ffef9e; border-color:#ffd04c; box-shadow:0 0 0 3px #ffd750,inset 0 0 0 2px white; animation:glow 1s infinite alternate; }
  .stack-count { position:absolute; bottom:4px; right:7px; border-radius:100px; background:#514c5ede; color:white; font-size:10px; font-weight:900; padding:2px 6px; z-index:4; box-shadow:0 2px 5px #3333; pointer-events:none; }
  /* Each character is built from CSS shapes; no downloaded assets needed. */
  .gob { --shell1:#ffb957; --shell2:#ff8338; --shell3:#e65a32; display:block; position:relative; flex-shrink:0; border-radius:47% 47% 43% 43%/51% 51% 45% 45%; width:75%; height:80%; background:radial-gradient(circle at 31% 19%,#ffffff77 0 9%,transparent 28%),linear-gradient(150deg,var(--shell1),var(--shell2) 55%,var(--shell3)); border:2px solid #ffffff80; box-shadow:inset 1px 3px 3px #ffffff70,inset -3px -5px 8px #a74b3540,0 5px 0 #352e3e1f,0 7px 9px #352e3e2e; pointer-events:none; z-index:2; }
  .gob.p1 { --shell1:#a4dcff; --shell2:#59b8ff; --shell3:#377bd4; }
  /* Monochrome: player 0 (the human in CPU mode) is black; player 1 is white. */
  html[data-palette="mono"] { --orange:#252734; --blue:#fff; }
  html[data-palette="mono"] .gob.p0 { --shell1:#707587; --shell2:#343746; --shell3:#171824; border-color:#696c78; box-shadow:inset 1px 3px 3px #ffffff35,inset -3px -5px 8px #090a1255,0 5px 0 #352e3e1f,0 7px 9px #352e3e2e; }
  html[data-palette="mono"] .gob.p1 { --shell1:#fff; --shell2:#f3f4f5; --shell3:#b3bac6; border-color:#acb3c0; box-shadow:inset 1px 3px 3px #fff,inset -3px -5px 8px #676e7d25,0 5px 0 #352e3e1f,0 7px 9px #352e3e2e; }
  html[data-palette="mono"] .gob.p0 .eye { background:#fdfbff; }
  html[data-palette="mono"] .gob.p0 .eye::after { background:#262639; }
  html[data-palette="mono"] .gob.p0 .mouth { border-bottom-color:#f9e7e8; }
  html[data-palette="mono"] .gob.p0 .cheek { background:#ffabc178; }
  html[data-palette="mono"] .turn-dot { background:linear-gradient(145deg,#676b7b,#242634); box-shadow:inset 0 -4px 0 #11121a90; border:1px solid #555d6a; }
  html[data-palette="mono"] .turn-dot.blue { background:linear-gradient(145deg,#fff,#d2d7e0); box-shadow:inset 0 -4px 0 #9ca7b480; border:1px solid #aeb8c4; }
  html[data-palette="mono"] .turn-dot::before,html[data-palette="mono"] .turn-dot::after { background:#fff; }
  html[data-palette="mono"] .turn-dot.blue::before,html[data-palette="mono"] .turn-dot.blue::after { background:#33304d; }
  html[data-palette="mono"] .pool.player0 { border-color:#a1a4b1; background:linear-gradient(110deg,#e7e8ec,#f7f8fb); }
  html[data-palette="mono"] .pool.player1 { border-color:#cbd0d8; background:linear-gradient(110deg,#fbfbfa,#f4f5f8); }
  html[data-palette="mono"] .pool.active.player0 { box-shadow:0 0 0 2px #fff,0 0 0 5px #626779,0 8px 20px #4c506322; }
  html[data-palette="mono"] .pool.active.player1 { box-shadow:0 0 0 2px #fff,0 0 0 5px #cbd0d8,0 8px 20px #73798822; }
  html[data-palette="mono"] .player0 .swatch { border:1px solid #515466; }
  html[data-palette="mono"] .player1 .swatch { border:1px solid #afb4bd; }
  html[data-palette="mono"] .token-slot.selected { border-color:#515466; box-shadow:0 0 0 3px #aeb0c0; }
  html[data-palette="mono"] .player1 .token-slot.selected { border-color:#9198a6; box-shadow:0 0 0 3px #d2d7df; }

  .gob.sz1 { width:46%; height:52%; } .gob.sz2 { width:64%; height:70%; } .gob.sz3 { width:83%; height:86%; }
  .gob::before, .gob::after { content:''; position:absolute; background:var(--shell1); width:21%; height:21%; border:1px solid #fff7; border-radius:8px 80% 7px 70%; top:-7%; z-index:-1; }
  .gob::before { left:14%; transform:rotate(-27deg); } .gob::after { right:14%; transform:rotate(19deg) scaleX(-1); }
  .gob .eyes { position:absolute; top:39%; left:21%; width:58%; display:flex; justify-content:space-around; }
  .gob .eye { width:16%; aspect-ratio: .78; border-radius:50%; background:#393049; position:relative; }
  .gob .eye::after { content:''; position:absolute; width:37%; height:29%; top:13%; left:17%; border-radius:50%; background:#fff; }
  .gob .mouth { position:absolute; width:24%; height:13%; top:59%; left:38%; border-bottom:clamp(1.5px,.6vw,3px) solid #733e49; border-radius: 0 0 100px 100px; }
  .gob .cheek { position:absolute; width:15%; height:8%; top:58%; left:11%; border-radius:50%; background:#ff5b7d80; }
  .gob .cheek.right { left:auto; right:11%; }
  .gob .feet { position:absolute; left:11%; bottom:-5%; width:23%; height:12%; border-radius:45%; background:var(--shell3); box-shadow:calc(var(--piece-foot-gap, 37px)) 0 0 var(--shell3); }
  .token-slot .gob { width:36px; height:38px; }
  .token-slot .gob.sz1 { width:23px; height:26px; }
  .token-slot .gob.sz2 { width:31px; height:33px; }
  .token-slot .gob.sz3 { width:40px; height:43px; }
  .token-slot .gob .feet { display:none; }
  .token-slot .gob .mouth { border-bottom-width:2px; }
  .legend { display:flex; justify-content:center; gap:13px; color:#9c8a7a; font-size:10px; font-weight:800; margin:-2px auto 15px; }
  .legend span { display:flex; gap:4px; align-items:center; }
  .legend b { background:#fff; border-radius:7px; padding:1px 5px; color:#ae8b63; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .action { flex:1; padding:12px 8px; border:0; border-radius:15px; background:white; color:#61566d; font-size:13px; font-weight:900; box-shadow:0 4px 12px #64503714; transition:transform .16s; }
  .action.primary { color:white; background:linear-gradient(120deg,#ffad58,#fb7955); box-shadow:0 4px 0 #de7542; }
  .action:disabled { color:#c2b9bf; box-shadow:none; background:#fff9; cursor:not-allowed; }
  footer { margin-top:16px; text-align:center; font-size:10px; color:#aa9e98; line-height:1.8; font-weight:650; }
  .toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translate(-50%,15px); max-width:calc(100vw - 30px); text-align:center; z-index:40; border-radius:14px; background:#3d3650f2; color:#fff; font-size:13px; padding:12px 17px; box-shadow:0 8px 25px #1114; opacity:0; pointer-events:none; transition:.2s; white-space:normal; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .modal-backdrop { position:fixed; inset:0; display:grid; place-items:center; z-index:30; background:#2d2b4280; backdrop-filter:blur(6px); padding:20px; }
  .modal-backdrop[hidden] { display:none; }
  .modal-card { width:100%; max-width:410px; border-radius:28px; background:#fffdfa; padding:28px 23px 22px; box-shadow:0 30px 70px #2c234f55; position:relative; border:2px solid #fff; animation:pop .3s ease-out; }
  .modal-card h2 { margin:0 0 12px; font-size:24px; text-align:center; }
  .modal-card p { font-size:13px; line-height:1.85; color:#5c536a; }
  .modal-card ul { padding-left:21px; font-size:13px; line-height:1.85; }
  .modal-card li+li { margin-top:6px; }
  .modal-card .action { width:100%; margin-top:11px; }
  .start-choices { display:flex; gap:11px; margin-top:18px; }
  .start-choices .action { min-height:74px; margin-top:0; font-size:16px; }
  .start-choices .action span { font-size:11px; display:block; margin-top:4px; opacity:.83; }
  .start-caption { text-align:center; margin:0; }
  .start-modal .close { display:none; }
  @media(max-width:350px) { .start-choices {flex-direction:column} .start-choices .action {min-height:54px} }
  .close { position:absolute; right:15px; top:14px; border:0; background:#f3ecf0; height:34px; width:34px; border-radius:12px; font-size:21px; color:#857a8c; }
  .win-icon { text-align:center; font-size:55px; margin-bottom:9px; }
  .win-text { text-align:center; font-size:14px; color:#837787; }
  .confetti-layer { pointer-events:none; position:fixed; inset:0; z-index:32; overflow:hidden; }
  .confetti { position:absolute; width:9px; height:15px; top:-20px; opacity:1; animation:confetti-fall var(--duration,2.5s) linear forwards; left:var(--x,50%); background:var(--color,#ff9a68); border-radius:3px; }
  @keyframes confetti-fall { to {transform:translate(var(--drift,40px),105vh) rotate(750deg); opacity:.5;} }
  @keyframes pop {0% {transform:scale(.66) translateY(-12%);} 70% {transform:scale(1.09);} 100%{transform:scale(1)} }
  @keyframes selected-bob {to{transform:translateY(-7px) rotate(2deg);} }
  @keyframes glow {to{box-shadow:0 0 0 4px #ffdc7b,0 0 18px #ffd35c;}}
  @media (max-width:390px) { .app{padding-left:10px;padding-right:10px;} .board{gap:6px;padding:9px;border-radius:23px;} .cell{border-radius:17px;} .token-slot {height:44px;} .token-slot .gob.sz3{width:34px;height:38px;} .token-slot .gob.sz2{width:28px;height:32px;} .pool{padding:9px 9px 10px;} .board-shell{margin:12px auto;} .legend{margin-bottom:12px;} .message {margin-bottom:12px;} }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span id="brandMark" class="brand-mark" aria-hidden="true">🟠🔵</span><div><h1>ぱくっと！ゴブとも</h1><p>ちいさな なかまの かさねっこバトル</p></div></div>
    <button id="helpButton" class="round-button" title="遊び方" aria-label="遊び方">?</button>
  </header>
  <div class="settings">
    <label class="select-wrap" aria-label="対戦モード"><select id="mode"><option value="cpu">🤖 CPUと対戦</option><option value="local">👫 ふたりで対戦</option></select></label>
    <label class="select-wrap" id="difficultyWrap" aria-label="コンピューターの強さ"><select id="difficulty"><option value="superEasy">🐣 すごくやさしい</option><option value="easy">🌱 やさしい</option><option value="normal" selected>⭐ ふつう</option><option value="hard">🔥 強い</option><option value="expert">👑 すごく強い</option></select></label>
    <button id="soundButton" class="round-button tiny" title="音のオン・オフ" aria-label="音のオン・オフ">♫</button>
  </div>
  <div class="palette-bar" role="group" aria-label="コマの色の組み合わせ">
    <span class="palette-label">コマの色</span>
    <div class="palette-choices">
      <button type="button" class="palette-choice" id="paletteColor" aria-pressed="true"><span class="palette-pair" aria-hidden="true"><i class="orange"></i><i class="blue"></i></span>オレンジ・青</button>
      <button type="button" class="palette-choice" id="paletteMono" aria-pressed="false"><span class="palette-pair" aria-hidden="true"><i class="white"></i><i class="black"></i></span>白・黒</button>
    </div>
  </div>
  <section class="message" aria-live="polite"><div class="turn-dot" id="turnDot"></div><div class="turn-copy"><strong id="statusTitle">オレンジの番！</strong><small id="statusHint">手持ちのコマをえらぼう</small></div><div class="turn-badge" id="turnNumber">1手目</div></section>
  <section id="bluePool" class="pool player1" aria-label="ブルーの持ち駒"><div class="pool-head"><span class="swatch"></span><span class="name"><span id="player1Name">ブルー</span> <span id="blueRole">CPU</span></span><span class="count" id="blueCount"></span></div><div class="tokens" id="blueTokens"></div></section>
  <div class="board-shell"><div class="board" id="board" role="group" aria-label="3かける3の盤面"></div></div>
  <div class="legend" aria-label="コマの大きさ"><span><b>小</b> ちび</span><span><b>中</b> ふつう</span><span><b>大</b> おおきい</span></div>
  <section id="orangePool" class="pool player0" aria-label="オレンジの持ち駒"><div class="pool-head"><span class="swatch"></span><span class="name"><span id="player0Name">オレンジ</span> <span id="orangeRole">あなた</span></span><span class="count" id="orangeCount"></span></div><div class="tokens" id="orangeTokens"></div></section>
  <div class="actions"><button class="action" id="undoButton">↶ ひとつ戻す</button><button class="action primary" id="restartButton">↻ もういちど</button></div>
  <footer>上のコマだけを動かせます。自分や相手の小さなコマに、ぱくっと重ねられます。<br>先手・後手は「もういちど」で選び直せます。通信なしで遊べます。</footer>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="modal" class="modal-backdrop" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button id="closeModal" class="close" aria-label="閉じる">×</button><div id="modalContent"></div></div></div>
<div id="confetti" class="confetti-layer" aria-hidden="true"></div>
<script>
(() => {
  'use strict';
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const NAMES = ['オレンジ','ブルー'];
  let palette = 'color';
  const SIZE_NAMES = ['', '小','中','大'];
  const boardEl = document.querySelector('#board');
  const modeEl = document.querySelector('#mode');
  const difficultyEl = document.querySelector('#difficulty');
  const modal = document.querySelector('#modal');
  const modalContent = document.querySelector('#modalContent');
  const toastEl = document.querySelector('#toast');
  let state, selected = null, history = [], seen = [], lastMove = -1, winningCells = [], aiTimer = null, aiBusy = false, toastTimer;
  let mode = 'cpu';
  let openingChoiceRequired = false;
  let soundOn = true, ctx = null, audioMaster = null, musicTimer = null, noteStep = 0;

  function setPalette(value) {
    palette = value === 'mono' ? 'mono' : 'color';
    NAMES[0] = palette === 'mono' ? 'ブラック' : 'オレンジ';
    NAMES[1] = palette === 'mono' ? 'ホワイト' : 'ブルー';
    document.documentElement.dataset.palette = palette;
    document.querySelector('#paletteColor').setAttribute('aria-pressed', String(palette === 'color'));
    document.querySelector('#paletteMono').setAttribute('aria-pressed', String(palette === 'mono'));
    document.querySelector('#brandMark').textContent = palette === 'mono' ? '⚫⚪' : '🟠🔵';
    document.querySelector('#player0Name').textContent = NAMES[0];
    document.querySelector('#player1Name').textContent = NAMES[1];
    document.querySelector('#orangePool').setAttribute('aria-label', NAMES[0]+'の持ち駒');
    document.querySelector('#bluePool').setAttribute('aria-label', NAMES[1]+'の持ち駒');
    try { localStorage.setItem('gobutomo-palette', palette); } catch(e) {}
    if(state) render();
  }


  function createState() { return { board:Array.from({length:9}, () => []), stock:[[0,2,2,2],[0,2,2,2]], turn:0, winner:null, draw:false, ply:0 }; }
  function cloneState(s) { return {board:s.board.map(stack => stack.slice()),stock:s.stock.map(a => a.slice()),turn:s.turn,winner:s.winner,draw:s.draw,ply:s.ply}; }
  function top(s, i) { const a=s.board[i]; return a.length ? a[a.length - 1] : null; }
  function getLine(s, p) { return LINES.find(line => line.every(i => top(s,i)?.p === p)) || null; }
  function legal(s, action) {
    if (s.winner !== null || s.draw || action.p !== s.turn) return false;
    const {from, to, size, p} = action;
    if (to<0 || to>8 || size<1 || size>3) return false;
    if (from !== -1) {
      if (from===to || from<0 || from>8) return false;
      const piece = top(s,from);
      if (!piece || piece.p!==p || piece.s!==size) return false;
    } else if (s.stock[p][size]<1) return false;
    const target = top(s,to);
    return !target || target.s < size;
  }
  function generate(s) {
    if (s.winner!==null || s.draw) return [];
    const p=s.turn, moves=[];
    for (let size=3;size>=1;size--) if(s.stock[p][size]>0) {
      for(let to=0;to<9;to++){const dest=top(s,to); if(!dest||dest.s<size) moves.push({p,from:-1,to,size});}
    }
    for(let from=0;from<9;from++){
      const piece=top(s,from); if(!piece||piece.p!==p) continue;
      for(let to=0;to<9;to++) if(to!==from){ const dest=top(s,to); if(!dest||dest.s<piece.s) moves.push({p,from,to,size:piece.s}); }
    }
    return moves;
  }
  function transition(s, a) {
    const next=cloneState(s);
    const piece = a.from === -1 ? {p:a.p,s:a.size} : next.board[a.from].pop();
    if(a.from===-1) next.stock[a.p][a.size]--;
    next.board[a.to].push(piece);
    const other = 1-a.p;
    // Evaluate after placement: an uncovered opponent line can be rescued by gobbling one of its pieces.
    if(getLine(next,other)) next.winner=other;
    else if(getLine(next,a.p)) next.winner=a.p;
    next.ply++;
    next.turn=other;
    if(next.winner===null && generate(next).length===0) next.draw=true;
    return next;
  }
  function signature(s){return `${s.turn}|${s.stock.map(a=>a.slice(1).join('')).join(':')}|${s.board.map(a=>a.map(x=>`${x.p}${x.s}`).join('')).join(';')}`;}
  function makeGob(p,size) {
    return `<span aria-hidden="true" class="gob p${p} sz${size}"><span class="eyes"><i class="eye"></i><i class="eye"></i></span><span class="cheek"></span><span class="cheek right"></span><span class="mouth"></span><span class="feet"></span></span>`;
  }
  function currentHuman(){ return !(mode==='cpu' && state.turn===1); }
  function canUndo(){return history.length>0 && (mode!=='cpu' || history.some(s=>s.turn===0));}
  function renderPool(p){
    const parent = document.querySelector(p===0?'#orangeTokens':'#blueTokens');
    const pool = document.querySelector(p===0?'#orangePool':'#bluePool');
    parent.innerHTML='';
    const active=state.turn===p&&!aiBusy&&!openingChoiceRequired&&!state.draw&&state.winner===null;
    pool.classList.toggle('active',active);
    pool.classList.toggle('dim',!active);
    const count=state.stock[p].slice(1).reduce((a,b)=>a+b,0);
    document.querySelector(p===0?'#orangeCount':'#blueCount').textContent=`のこり ${count} / 6`;
    for(const size of [3,3,2,2,1,1]){
      const slot = size===3 ? (parent.querySelectorAll('[data-size="3"]').length) : size===2 ? parent.querySelectorAll('[data-size="2"]').length : parent.querySelectorAll('[data-size="1"]').length;
      const filled=slot<state.stock[p][size];
      const button=document.createElement('button');
      button.type='button'; button.className='token-slot'+(!filled?' empty':'');
      button.dataset.size=size;
      const isSelected=selected?.kind==='stock'&&selected.size===size&&selected.slot===slot&&state.turn===p;
      if(isSelected) button.classList.add('selected');
      button.disabled=!active||!filled||(mode==='cpu'&&p===1);
      button.setAttribute('aria-label',`${NAMES[p]}の${SIZE_NAMES[size]}サイズ ${slot+1}個目${filled?'':' 使用済み'}`);
      button.innerHTML=`${makeGob(p,size)}<span class="size-tag">${SIZE_NAMES[size]}</span>`;
      button.addEventListener('click',()=>selectStock(size,slot));
      parent.appendChild(button);
    }
  }
  function selectedAction(to){
    if(!selected) return null;
    return {p:state.turn,from:selected.kind==='stock'?-1:selected.from,to,size:selected.size};
  }
  function render(){
    renderPool(1);
    renderPool(0);
    boardEl.innerHTML='';
    for(let i=0;i<9;i++){
      const piece=top(state,i), stack=state.board[i];
      const button=document.createElement('button');
      button.type='button'; button.className='cell';
      const act=selectedAction(i);
      if(act && legal(state,act) && currentHuman()) button.classList.add('can-drop');
      if(selected?.kind==='board' && selected.from===i) button.classList.add('origin');
      if(lastMove===i) button.classList.add('last');
      if(winningCells.includes(i)) button.classList.add('win-cell');
      let description=piece?`${NAMES[piece.p]}の${SIZE_NAMES[piece.s]}サイズ`:'空きマス';
      if(stack.length>1)description+=`、${stack.length}個重なっています`;
      button.setAttribute('aria-label',`${Math.floor(i/3)+1}行${i%3+1}列、${description}`);
      button.innerHTML=(piece?makeGob(piece.p,piece.s):'') + (stack.length>1?`<span class="stack-count">${stack.length}枚</span>`:'');
      button.addEventListener('click',()=>pressCell(i));
      boardEl.appendChild(button);
    }
    const dot=document.querySelector('#turnDot');
    dot.classList.toggle('blue',state.turn===1);
    const title=document.querySelector('#statusTitle'), hint=document.querySelector('#statusHint');
    if(state.winner!==null){
      title.textContent=`${NAMES[state.winner]}の かち！`;
      hint.textContent='3つならんだね！ おめでとう！';
    } else if(state.draw){title.textContent='ひきわけ！';hint.textContent='いい勝負！ もう一度あそぼう';}
    else if(aiBusy){title.textContent=`${NAMES[1]}が かんがえ中…`;hint.textContent='どこに ぱくっとするかな？';}
    else if(selected){title.textContent=`${NAMES[state.turn]}の${SIZE_NAMES[selected.size]}を いどう！`;hint.textContent='みどり色のマスをタップしてね';}
    else {title.textContent=`${NAMES[state.turn]}の番！`;hint.textContent=(mode==='cpu'&&state.turn===1)?`${NAMES[1]}が考えています`:'手持ちのコマ、または自分の盤上のコマをタップ';}
    document.querySelector('#turnNumber').textContent=`${state.ply+1}手目`;
    document.querySelector('#undoButton').disabled=!canUndo() || openingChoiceRequired;
    document.querySelector('#blueRole').textContent=mode==='cpu'?'・CPU':'';
    document.querySelector('#orangeRole').textContent=mode==='cpu'?'・あなた':'';
    document.querySelector('#difficultyWrap').style.display=mode==='cpu'?'':'none';
    document.querySelector('#soundButton').textContent=soundOn?'♫':'♪̸';
    document.querySelector('#soundButton').title=soundOn?'音を消す':'音を出す';
  }
  function selectStock(size,slot){
    if(openingChoiceRequired||!currentHuman()||aiBusy||state.winner!==null||state.draw||state.stock[state.turn][size]===0)return;
    selected = selected?.kind==='stock'&&selected.size===size&&selected.slot===slot?null:{kind:'stock',size,slot};
    sfx('select'); render();
  }
  function pressCell(i){
    if(openingChoiceRequired||!currentHuman()||aiBusy||state.winner!==null||state.draw)return;
    const piece=top(state,i);
    if(selected){
      const action=selectedAction(i);
      if(legal(state,action)){commit(action);return;}
      if(selected.kind==='board'&&selected.from===i){selected=null;sfx('select');render();return;}
      if(piece && piece.p===state.turn){selected={kind:'board',from:i,size:piece.s};sfx('select');render();return;}
      toast('そこには置けません。もっと大きいコマが必要です');sfx('error');return;
    }
    if(piece&&piece.p===state.turn){selected={kind:'board',from:i,size:piece.s};sfx('select');render();}
    else {toast('まず手持ちのコマか、盤上にある自分のコマを選んでね');sfx('error');}
  }
  function commit(action){
    if(!legal(state,action))return;
    const stackWas=state.board[action.to].length>0;
    history.push(cloneState(state));
    state=transition(state,action);
    seen.push(signature(state));
    if(state.winner===null && !state.draw){
      const count=seen.filter(x=>x===seen[seen.length-1]).length;
      if(count>=3 || state.ply>=120)state.draw=true;
    }
    lastMove=action.to; selected=null; winningCells = state.winner!==null ? (getLine(state,state.winner)||[]) : [];
    sfx(state.winner!==null?'win':stackWas?'gobble':'drop');
    if(navigator.vibrate)try{navigator.vibrate(state.winner!==null?[20,40,20]:15);}catch(e){}
    render();
    if(state.winner!==null||state.draw){setTimeout(()=>finish(),350);return;}
    if(mode==='cpu'&&state.turn===1) scheduleAi();
  }
  function toast(message){clearTimeout(toastTimer);toastEl.textContent=message;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2100);}

  function staticEval(s,p){
    const other=1-p;
    if(s.winner!==null)return s.winner===p?100000:-100000;
    let score=0;
    for(const line of LINES){
      let mine=0,theirs=0,mineSizes=0,theirSizes=0;
      for(const i of line){const a=top(s,i);if(!a)continue;if(a.p===p){mine++;mineSizes+=a.s;}else{theirs++;theirSizes+=a.s;}}
      if(mine===3) score+=20000;
      else if(theirs===3) score-=20000;
      else if(mine===2&&theirs===0)score+=125+mineSizes*4;
      else if(theirs===2&&mine===0)score-=135+theirSizes*4;
      else if(mine===2&&theirs===1)score+=theirSizes<3?35:6;
      else if(theirs===2&&mine===1)score-=mineSizes<3?38:6;
      else if(mine===1&&theirs===0)score+=10;
      else if(theirs===1&&mine===0)score-=11;
    }
    for(let i=0;i<9;i++){const a=top(s,i);if(!a)continue;const w=(i===4?16:(i%2===0?7:4))+(a.s-1)*3;score+=(a.p===p?w:-w);}
    for(let z=1;z<=3;z++)score+=(s.stock[p][z]-s.stock[other][z])*(z===3?7:z===2?5:3);
    return score;
  }
  function bestAiAction(){
    const actions=generate(state); if(!actions.length)return null;
    let candidates=actions.map(a=>({a,s:transition(state,a)}));
    if(difficultyEl.value==='superEasy'){
      // For preschoolers: do not block their two-in-a-row; actively leave easy wins.
      // Always avoid winning ourselves if a different move is available.
      const nonWinning=candidates.filter(c=>c.s.winner!==1);
      if(nonWinning.length)candidates=nonWinning;
      const scored=candidates.map(({a,s})=>{
        let humanWins=0;
        if(s.winner===0)humanWins=20;
        else if(s.winner===null){
          // Human moves next; favor positions where they can win in one move.
          for(const reply of generate(s)){
            if(transition(s,reply).winner===0 && ++humanWins>=8)break;
          }
        }
        const target=top(state,a.to);
        const score=humanWins*80 + (a.from===-1?30:-8)
          + (a.size===1?28:a.size===2?10:0)
          + (target?.p===0?-65:0) + (a.to===4?-10:0)
          - Math.max(-150,Math.min(150,staticEval(s,1)))*.12
          + Math.random()*15;
        return {a,score};
      });
      scored.sort((x,y)=>y.score-x.score);
      return scored[Math.floor(Math.random()*Math.min(3,scored.length))].a;
    }
    if(difficultyEl.value==='easy'){
      // Intentionally weak: random play and frequent missed wins/blocks.
      const nonWinning=candidates.filter(c=>c.s.winner!==1);
      const choices=(nonWinning.length && Math.random()<.7) ? nonWinning : candidates;
      return choices[Math.floor(Math.random()*choices.length)].a;
    }
    // Normal and stronger levels recognize immediate wins.
    const winNow=candidates.filter(c=>c.s.winner===1);
    if(winNow.length)return winNow[Math.floor(Math.random()*winNow.length)].a;
    if(difficultyEl.value==='normal'){
      const nonLosing=candidates.filter(c=>c.s.winner!==0);
      if(nonLosing.length)candidates=nonLosing;
      candidates.sort((a,b)=>staticEval(b.s,1)-staticEval(a.s,1));
      return candidates[Math.floor(Math.random()*Math.min(5,candidates.length))].a;
    }
    const expert=difficultyEl.value==='expert';
    const depth=expert?5:3;
    const maxNodes=expert?100000:22000;
    const stopAt=performance.now()+(expert?900:470);
    const transposition=new Map();
    let nodes=0;
    function search(s,d,alpha,beta){
      if(s.winner!==null) return s.winner===s.turn?100000+d*1000:-100000-d*1000;
      if(s.draw)return 0;
      if(d===0||++nodes>maxNodes||performance.now()>stopAt)return staticEval(s,s.turn);
      const key=signature(s)+'/'+d;
      const cached=transposition.get(key);
      if(cached!==undefined)return cached;
      let moves=generate(s);if(!moves.length)return 0;
      let options=moves.map(a=>{const next=transition(s,a);return {next, priority:-staticEval(next,next.turn)};});
      options.sort((a,b)=>b.priority-a.priority);
      // Keep the principal tactical continuations while staying responsive on mobile.
      if(d>=2 && options.length>(expert?19:14)) options=options.slice(0,expert?19:14);
      let best=-Infinity, cutoff=false;
      for(const {next} of options){
        const value=-search(next,d-1,-beta,-alpha);
        if(value>best)best=value;
        if(value>alpha)alpha=value;
        if(alpha>=beta){cutoff=true;break;}
        if(nodes>maxNodes||performance.now()>stopAt)break;
      }
      if(!cutoff&&nodes<=maxNodes&&performance.now()<=stopAt)transposition.set(key,best);
      return best;
    }
    candidates.sort((a,b)=>staticEval(b.s,1)-staticEval(a.s,1));
    let best=-Infinity,bestActions=[];
    for(const {a,s} of candidates){
      const value=-search(s,depth-1,-Infinity,Infinity);
      if(value>best+0.01){best=value;bestActions=[a];}
      else if(Math.abs(value-best)<.01)bestActions.push(a);
    }
    return bestActions[Math.floor(Math.random()*bestActions.length)]||candidates[0].a;
  }
  function scheduleAi(){
    aiBusy=true;render();clearTimeout(aiTimer);
    aiTimer=setTimeout(()=>{
      if(openingChoiceRequired||mode!=='cpu'||state.turn!==1||state.winner!==null||state.draw)return;
      const move=bestAiAction();aiBusy=false;
      if(move)commit(move);else {state.draw=true;render();finish();}
    },480);
  }
  function undo(){
    if(!canUndo()||openingChoiceRequired)return;
    clearTimeout(aiTimer);aiBusy=false;
    let n=1;
    if(mode==='cpu' && state.turn===0 && history.length>=2)n=2;
    for(let i=0;i<n&&history.length;i++){state=history.pop();seen.pop();}
    selected=null;lastMove=-1;winningCells=[];
    document.querySelector('#confetti').innerHTML='';
    modal.hidden=true;
    sfx('select');render();
  }
  function reset(){
    clearTimeout(aiTimer);aiBusy=false;
    state=createState();selected=null;history=[];seen=[signature(state)];lastMove=-1;winningCells=[];
    document.querySelector('#confetti').innerHTML='';modal.hidden=true;
    openingChoiceRequired=true;
    render();
    showStartChoice();
  }
  function showStartChoice(){
    const labels=mode==='cpu' ? ['あなたが先手','あなたが後手'] : [`${NAMES[0]}が先手`,`${NAMES[1]}が先手`];
    const note=mode==='cpu' ? `あなたは${NAMES[0]}、CPUは${NAMES[1]}です。` : 'ふたりで交互にコマを置きます。';
    showModal(`<h2 id="modalTitle">どちらから はじめる？</h2><p class="start-caption">${note}<br>先手か後手を えらんでね！</p><div class="start-choices"><button type="button" class="action primary" id="startFirst">${labels[0]}<span>さいしょに置く</span></button><button type="button" class="action" id="startSecond">${labels[1]}<span>あとから置く</span></button></div>`);
    modal.classList.add('start-modal');
    document.querySelector('#startFirst').addEventListener('click',()=>startMatch(0));
    document.querySelector('#startSecond').addEventListener('click',()=>startMatch(1));
  }
  function startMatch(firstPlayer){
    state=createState();state.turn=firstPlayer;
    history=[];seen=[signature(state)];selected=null;lastMove=-1;winningCells=[];
    openingChoiceRequired=false;
    modal.classList.remove('start-modal');modal.hidden=true;
    // A button click allows mobile browsers to start audio playback.
    getAudio();
    render();
    if(mode==='cpu' && state.turn===1)scheduleAi();
  }
  function showModal(content){modalContent.innerHTML=content;modal.hidden=false;}
  function finish(){
    if(state.winner===null && !state.draw)return;
    if(state.winner!==null)confetti();
    const color=palette==='mono' ? (state.winner===0?'#303340':'#646b7a') : (state.winner===0?'#ee853f':'#3b9cf0');
    showModal(`<div class="win-icon">${state.draw?'🤝':state.winner===0?(palette==='mono'?'🏆⚫':'🏆🧡'):(palette==='mono'?'🏆⚪':'🏆💙')}</div><h2 id="modalTitle" style="color:${state.draw?'#76658a':color}">${state.draw?'ひきわけ！':NAMES[state.winner]+'の かち！'}</h2><p class="win-text">${state.draw?'3回同じ局面になったか、120手に到達しました。':'3つのコマを まっすぐならべたね！'}</p><button class="action primary" id="playAgain">もういっかい あそぶ！</button>`);
    document.querySelector('#playAgain').addEventListener('click',reset);
  }
  function confetti(){const layer=document.querySelector('#confetti');layer.innerHTML='';const colors=['#ffbb43','#ff6c93','#72c6fc','#8fe0b0','#bb9dff'];for(let i=0;i<42;i++){const c=document.createElement('span');c.className='confetti';c.style.setProperty('--x',Math.random()*100+'%');c.style.setProperty('--duration',(1.8+Math.random()*1.7)+'s');c.style.setProperty('--drift',(Math.random()*260-130)+'px');c.style.setProperty('--color',colors[i%colors.length]);c.style.animationDelay=(Math.random()*.7)+'s';layer.appendChild(c);}setTimeout(()=>layer.innerHTML='',4000);}

  function getAudio(){
    if(!soundOn)return null;
    if(!ctx){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return null;ctx=new AudioCtor();audioMaster=ctx.createGain();audioMaster.gain.value=.28;audioMaster.connect(ctx.destination);}
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});
    if(!musicTimer)startMusic();
    return ctx;
  }
  function tone(freq,time,duration,volume=.14,type='sine',slide=0){
    if(!ctx||!audioMaster)return;
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,time);
    if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(freq+slide,30),time+duration*.75);
    gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(volume,time+.014);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
    osc.connect(gain).connect(audioMaster);osc.start(time);osc.stop(time+duration+.015);
  }
  function sfx(name){
    const c=getAudio();if(!c)return;
    const t=c.currentTime;
    if(name==='select')tone(600,t,.09,.13,'sine',100);
    if(name==='drop'){tone(420,t,.14,.2,'sine',-105);tone(660,t+.07,.12,.11,'triangle');}
    if(name==='gobble'){tone(350,t,.16,.18,'sine',-95);tone(480,t+.08,.16,.19,'triangle',190);}
    if(name==='error')tone(210,t,.15,.09,'triangle',-35);
    if(name==='win')for(let i=0;i<6;i++)tone([523,659,784,1047,1175,1568][i],t+i*.10,.3,.16,'sine');
  }
  function startMusic(){
    if(musicTimer||!soundOn||!ctx)return;
    const melody=[0,4,7,12,7,4,2,5,9,12,9,5,0,4,7,9,7,4,2,4,7,11,7,4];
    const hz=n=>261.63*Math.pow(2,n/12);
    musicTimer=setInterval(()=>{
      if(!ctx||ctx.state!=='running'||document.hidden||!soundOn)return;
      const t=ctx.currentTime;
      tone(hz(melody[noteStep%melody.length]),t,.25,.113,'triangle');
      if(noteStep%4===0)tone(hz([-12,-7,-9,-5][Math.floor(noteStep/4)%4]),t,.35,.078,'sine');
      noteStep++;
    },350);
  }
  function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
  function showRules(){
    if(openingChoiceRequired)return;
    showModal(`<h2 id="modalTitle">あそびかた</h2><p>${NAMES[0]}と${NAMES[1]}、それぞれ<strong>小・中・大が2個ずつ</strong>。3×3の盤であそびます。</p><ul><li>自分の番に、手持ちのコマをひとつ置くか、盤にある自分のコマを別のマスに動かせます。</li><li>空きマスのほか、<strong>自分より小さいコマ</strong>の上にぱくっとかぶせられます。相手のコマでも自分のコマでもOK！</li><li>動かせるのは、一番上に見えている自分のコマだけ。動かすと下のコマがまた現れます。</li><li>たて・よこ・ななめに、自分の色が3つならんだら勝ち！</li></ul><p>ヒント：置ける場所はみどり色になります。移動中に相手の3つが見えても、同じ手で覆い直せばセーフです。</p><button class="action primary" id="understood">あそぶ！</button>`);
    document.querySelector('#understood').addEventListener('click',()=>modal.hidden=true);
  }
  document.querySelector('#helpButton').addEventListener('click',()=>{getAudio();showRules();});
  document.querySelector('#closeModal').addEventListener('click',()=>{if(!openingChoiceRequired)modal.hidden=true;});
  modal.addEventListener('click',e=>{if(e.target===modal&&!openingChoiceRequired)modal.hidden=true;});
  document.querySelector('#undoButton').addEventListener('click',undo);
  document.querySelector('#restartButton').addEventListener('click',reset);
  modeEl.addEventListener('change',()=>{mode=modeEl.value;reset();});
  difficultyEl.addEventListener('change',()=>{toast('コンピューターの強さを変えました');});
  document.querySelector('#soundButton').addEventListener('click',()=>{soundOn=!soundOn;if(!soundOn)stopMusic();else getAudio();render();});
  document.querySelector('#paletteColor').addEventListener('click',()=>setPalette('color'));
  document.querySelector('#paletteMono').addEventListener('click',()=>setPalette('mono'));
  window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden){if(!openingChoiceRequired)modal.hidden=true;}else if(selected){selected=null;render();}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(soundOn&&ctx)startMusic();});
  let savedPalette = 'color';
  try { savedPalette = localStorage.getItem('gobutomo-palette') || 'color'; } catch(e) {}
  setPalette(savedPalette);
  reset();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
